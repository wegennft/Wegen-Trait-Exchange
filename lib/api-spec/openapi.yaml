openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Wegen NFT Trait Store API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: traits
    description: NFT trait operations
  - name: locker
    description: User trait locker operations
  - name: nfts
    description: NFT operations
  - name: admin
    description: Admin operations
  - name: points
    description: Store points purchase and balance operations
  - name: bundles
    description: Trait bundle browsing and purchase operations
  - name: Storage
    description: Object storage upload and serving endpoints.
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /storage/uploads/request-url:
    post:
      tags: [Storage]
      operationId: requestUploadUrl
      summary: Request a presigned URL for file upload
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UploadUrlRequest'
      responses:
        '200':
          description: Presigned upload URL generated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadUrlResponse'
        '400':
          description: Missing or invalid required fields.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: Failed to generate upload URL.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /storage/public-objects/{filePath}:
    get:
      tags: [Storage]
      operationId: getPublicObject
      summary: Serve a public asset
      parameters:
        - name: filePath
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Object content.
          content:
            '*/*':
              schema:
                type: string
                format: binary
        '404':
          description: File not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /storage/objects/{objectPath}:
    get:
      tags: [Storage]
      operationId: getStorageObject
      summary: Serve an uploaded object
      parameters:
        - name: objectPath
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Object content.
          content:
            '*/*':
              schema:
                type: string
                format: binary
        '404':
          description: Object not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /traits:
    get:
      operationId: listTraits
      tags: [traits]
      summary: List all available traits in the store
      parameters:
        - name: category
          in: query
          schema:
            type: string
        - name: theme
          in: query
          schema:
            type: string
          description: Filter traits by theme/collection name
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
        - name: includeAll
          in: query
          schema:
            type: boolean
            default: false
          description: If true, include inactive (vault) traits as well
        - name: nftCollection
          in: query
          schema:
            type: string
            enum: [wegens, wegenettes]
            default: wegens
          description: Which NFT collection to list traits for
      responses:
        "200":
          description: List of traits
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TraitListResponse"

  /traits/variant-collections:
    get:
      operationId: listVariantCollections
      tags: [traits]
      summary: List all unique variant pack names for a collection
      parameters:
        - name: nftCollection
          in: query
          schema:
            type: string
      responses:
        "200":
          description: List of variant collection names
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VariantCollectionsResponse"

  /traits/variants/by-collection:
    get:
      operationId: getVariantsByCollection
      tags: [traits]
      summary: Get variant image map for all traits in a named pack
      parameters:
        - name: nftCollection
          in: query
          schema:
            type: string
        - name: name
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Map of traitId to variant info
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VariantsByCollectionResponse"

  /traits/{traitId}/variants:
    get:
      operationId: listTraitVariants
      tags: [traits]
      summary: List variants for a trait
      parameters:
        - name: traitId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of trait variants
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TraitVariantsResponse"

  /admin/traits/{traitId}/variants:
    post:
      operationId: createTraitVariant
      tags: [admin]
      summary: Add a variant to a trait
      parameters:
        - name: traitId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTraitVariantBody"
      responses:
        "200":
          description: Created variant
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TraitVariantResponse"

  /admin/variants/{variantId}:
    delete:
      operationId: deleteTraitVariant
      tags: [admin]
      summary: Delete a trait variant
      parameters:
        - name: variantId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteResponse"

  /traits/{traitId}:
    get:
      operationId: getTrait
      tags: [traits]
      summary: Get a specific trait
      parameters:
        - name: traitId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Trait details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Trait"
        "404":
          description: Trait not found

  /traits/categories:
    get:
      operationId: listTraitCategories
      tags: [traits]
      summary: List all trait categories
      responses:
        "200":
          description: List of categories
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CategoriesResponse"

  /store/themes:
    get:
      operationId: listStoreThemes
      tags: [traits]
      summary: List all trait themes/collections
      responses:
        "200":
          description: List of themes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ThemesResponse"

  /locker/{walletAddress}:
    get:
      operationId: getLocker
      tags: [locker]
      summary: Get a user's trait locker
      parameters:
        - name: walletAddress
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: User's locker contents
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LockerResponse"

  /locker/{walletAddress}/purchase:
    post:
      operationId: purchaseTrait
      tags: [locker]
      summary: Record a trait purchase into user locker
      parameters:
        - name: walletAddress
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PurchaseTraitBody"
      responses:
        "201":
          description: Trait purchased and added to locker
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LockerItem"
        "400":
          description: Invalid request or out of stock

  /nfts/{walletAddress}:
    get:
      operationId: getUserNfts
      tags: [nfts]
      summary: Get user's Wegen NFTs
      parameters:
        - name: walletAddress
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: User's NFTs
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NftListResponse"

  /nfts/{tokenId}/apply-trait:
    post:
      operationId: applyTrait
      tags: [nfts]
      summary: Apply a trait from locker to an NFT
      parameters:
        - name: tokenId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApplyTraitBody"
      responses:
        "200":
          description: Trait applied successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApplyTraitResponse"
        "400":
          description: Trait not in locker or invalid

  /nfts/{tokenId}/remove-trait:
    post:
      operationId: removeTrait
      tags: [nfts]
      summary: Remove a trait from an NFT (returns to locker)
      parameters:
        - name: tokenId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RemoveTraitBody"
      responses:
        "200":
          description: Trait removed and returned to locker
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RemoveTraitResponse"

  /nfts/{tokenId}/confirm-traits:
    post:
      operationId: confirmTraits
      tags: [nfts]
      summary: Confirm current trait loadout and push metadata on-chain
      parameters:
        - name: tokenId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConfirmTraitsBody"
      responses:
        "200":
          description: Metadata updated on-chain
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConfirmTraitsResponse"
        "400":
          description: No equipped traits or wallet mismatch

  /store/stats:
    get:
      operationId: getStoreStats
      tags: [traits]
      summary: Get store statistics (total traits, sales, categories)
      responses:
        "200":
          description: Store stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StoreStats"

  /legends:
    get:
      operationId: listLegends
      tags: [traits]
      summary: List active legends for a collection
      parameters:
        - name: nftCollection
          in: query
          schema:
            type: string
            enum: [wegens, wegenettes]
            default: wegens
      responses:
        "200":
          description: List of legends
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListLegendsResponse"

  /legends/mine:
    get:
      operationId: getMyLegends
      tags: [traits]
      summary: Get legends owned by a wallet (cross-references token IDs)
      parameters:
        - name: walletAddress
          in: query
          required: true
          schema:
            type: string
        - name: nftCollection
          in: query
          schema:
            type: string
            enum: [wegens, wegenettes]
            default: wegens
      responses:
        "200":
          description: Legends owned by this wallet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListLegendsResponse"

  /legends/all:
    get:
      operationId: listAllLegends
      tags: [admin]
      summary: List all legends (including inactive) for admin
      parameters:
        - name: nftCollection
          in: query
          schema:
            type: string
            enum: [wegens, wegenettes]
            default: wegens
      responses:
        "200":
          description: All legends
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListLegendsResponse"

  /legends/variant-collections:
    get:
      operationId: listLegendVariantCollections
      tags: [traits]
      summary: List enabled variant pack names for legends
      parameters:
        - name: nftCollection
          in: query
          schema:
            type: string
            enum: [wegens, wegenettes]
            default: wegens
      responses:
        "200":
          description: Pack names
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VariantCollectionsResponse"

  /legends/variants/by-collection:
    get:
      operationId: getLegendVariantsByCollection
      tags: [traits]
      summary: Get legend variant images for a named pack
      parameters:
        - name: nftCollection
          in: query
          required: true
          schema:
            type: string
        - name: name
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Legend variant map
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VariantsByCollectionResponse"

  /legends/{id}/variants:
    get:
      operationId: getLegendVariants
      tags: [admin]
      summary: Get all variants for a specific legend
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Variants list
          content:
            application/json:
              schema:
                type: object
                properties:
                  variants:
                    type: array
                    items:
                      $ref: "#/components/schemas/LegendVariant"
                required: [variants]

  /admin/legends:
    post:
      operationId: createLegend
      tags: [admin]
      summary: Create a new legend
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateLegendBody"
      responses:
        "201":
          description: Legend created
          content:
            application/json:
              schema:
                type: object
                properties:
                  legend:
                    $ref: "#/components/schemas/LegendItem"
                required: [legend]

  /admin/legends/{id}:
    put:
      operationId: updateLegend
      tags: [admin]
      summary: Update a legend
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateLegendBody"
      responses:
        "200":
          description: Legend updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  legend:
                    $ref: "#/components/schemas/LegendItem"
                required: [legend]
    delete:
      operationId: deleteLegend
      tags: [admin]
      summary: Delete a legend
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteResponse"

  /admin/legends/{id}/variants:
    post:
      operationId: createLegendVariant
      tags: [admin]
      summary: Add a variant image to a legend
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateLegendVariantBody"
      responses:
        "200":
          description: Variant added
          content:
            application/json:
              schema:
                type: object
                properties:
                  variant:
                    $ref: "#/components/schemas/LegendVariant"
                required: [variant]

  /admin/legend-variants/{variantId}:
    delete:
      operationId: deleteLegendVariant
      tags: [admin]
      summary: Delete a legend variant
      parameters:
        - name: variantId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteResponse"

  /admin/traits:
    post:
      operationId: createTrait
      tags: [admin]
      summary: Create a new trait (admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTraitBody"
      responses:
        "201":
          description: Trait created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Trait"

  /admin/traits/{traitId}:
    put:
      operationId: updateTrait
      tags: [admin]
      summary: Update trait price or quantity (admin only)
      parameters:
        - name: traitId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateTraitBody"
      responses:
        "200":
          description: Trait updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Trait"
    delete:
      operationId: deleteTrait
      tags: [admin]
      summary: Delete a trait (admin only)
      parameters:
        - name: traitId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteResponse"

  /admin/stats:
    get:
      operationId: getAdminStats
      tags: [admin]
      summary: Get admin dashboard stats
      responses:
        "200":
          description: Admin stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminStats"

  /admin/import-nft:
    post:
      operationId: importNftMetadata
      tags: [admin]
      summary: Import a Wegen NFT from its on-chain metadata JSON
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ImportNftBody"
      responses:
        "200":
          description: NFT imported or updated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportNftResponse"
        "400":
          description: Invalid metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /admin/list-nfts:
    get:
      operationId: listAdminNfts
      tags: [admin]
      summary: List all Wegen NFTs registered in the system
      responses:
        "200":
          description: List of NFTs
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminNftListResponse"

  /admin/delete-nft/{tokenId}:
    delete:
      operationId: deleteAdminNft
      tags: [admin]
      summary: Remove a Wegen NFT record from the system
      parameters:
        - name: tokenId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: NFT deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteResponse"

  /point-packs:
    get:
      operationId: listPointPacks
      tags: [points]
      summary: List active point packs available for purchase
      responses:
        "200":
          description: List of point packs
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PointPackListResponse"

  /point-packs/{packId}/purchase:
    post:
      operationId: purchasePointPack
      tags: [points]
      summary: Purchase a point pack with ETH, crediting points to the wallet
      parameters:
        - name: packId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PurchasePointPackBody"
      responses:
        "201":
          description: Points purchased and credited
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StorePointsBalance"
        "404":
          description: Point pack not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /wallet/{walletAddress}/points:
    get:
      operationId: getStorePoints
      tags: [points]
      summary: Get a wallet's store points balance
      parameters:
        - name: walletAddress
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Store points balance
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StorePointsBalance"

  /admin/point-packs:
    get:
      operationId: listAdminPointPacks
      tags: [admin]
      summary: List all point packs, including inactive ones (admin only)
      responses:
        "200":
          description: List of point packs
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PointPackListResponse"
    post:
      operationId: createPointPack
      tags: [admin]
      summary: Create a new point pack (admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePointPackBody"
      responses:
        "201":
          description: Point pack created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PointPack"

  /admin/point-packs/{packId}:
    put:
      operationId: updatePointPack
      tags: [admin]
      summary: Update a point pack (admin only)
      parameters:
        - name: packId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePointPackBody"
      responses:
        "200":
          description: Point pack updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PointPack"
    delete:
      operationId: deletePointPack
      tags: [admin]
      summary: Delete a point pack (admin only)
      parameters:
        - name: packId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteResponse"

  /bundles:
    get:
      operationId: listBundles
      tags: [bundles]
      summary: List active trait bundles available for purchase
      responses:
        "200":
          description: List of trait bundles
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BundleListResponse"

  /bundles/{bundleId}/purchase:
    post:
      operationId: purchaseBundle
      tags: [bundles]
      summary: Purchase a trait bundle with ETH, adding all its traits to the wallet's locker
      parameters:
        - name: bundleId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PurchaseBundleBody"
      responses:
        "201":
          description: Bundle purchased and traits added to locker
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PurchaseBundleResponse"
        "404":
          description: Bundle not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "409":
          description: Bundle sold out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /admin/bundles:
    get:
      operationId: listAdminBundles
      tags: [admin]
      summary: List all trait bundles, including inactive ones (admin only)
      responses:
        "200":
          description: List of trait bundles
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BundleListResponse"
    post:
      operationId: createBundle
      tags: [admin]
      summary: Create a new trait bundle (admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateBundleBody"
      responses:
        "201":
          description: Bundle created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Bundle"

  /admin/bundles/{bundleId}:
    put:
      operationId: updateBundle
      tags: [admin]
      summary: Update a trait bundle (admin only)
      parameters:
        - name: bundleId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateBundleBody"
      responses:
        "200":
          description: Bundle updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Bundle"
    delete:
      operationId: deleteBundle
      tags: [admin]
      summary: Delete a trait bundle (admin only)
      parameters:
        - name: bundleId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteResponse"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    PayoutSplit:
      type: object
      properties:
        walletAddress:
          type: string
          description: Ethereum wallet address receiving funds
        percentage:
          type: number
          minimum: 0
          maximum: 100
          description: Percentage of sale proceeds (0-100)
      required:
        - walletAddress
        - percentage

    Trait:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        category:
          type: string
        theme:
          type: string
          nullable: true
          description: Named collection/theme this trait belongs to (e.g. "Stoner Traits", "70s Vibes")
        description:
          type: string
          nullable: true
        imageUrl:
          type: string
          nullable: true
        mediaType:
          type: string
          nullable: true
        priceUsd:
          type: string
          description: Fixed USD price (source of truth, as string to avoid floating point issues)
        priceEth:
          type: string
          description: Live-computed ETH equivalent, snapshotted from priceUsd on last save (as string)
        priceWei:
          type: string
          description: Price in wei
        totalSupply:
          type: integer
        remainingSupply:
          type: integer
        isActive:
          type: boolean
        rarity:
          type: string
          enum: [common, uncommon, rare, legendary]
        nftCollection:
          type: string
          nullable: true
        payoutSplits:
          type: array
          items:
            $ref: "#/components/schemas/PayoutSplit"
          description: Wallet addresses and their percentage share of sale proceeds
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - name
        - category
        - priceUsd
        - priceEth
        - priceWei
        - totalSupply
        - remainingSupply
        - isActive
        - rarity
        - payoutSplits
        - createdAt

    TraitListResponse:
      type: object
      properties:
        traits:
          type: array
          items:
            $ref: "#/components/schemas/Trait"
        total:
          type: integer
        page:
          type: integer
        limit:
          type: integer
      required:
        - traits
        - total
        - page
        - limit

    CategoriesResponse:
      type: object
      properties:
        categories:
          type: array
          items:
            type: string
      required:
        - categories

    LockerItem:
      type: object
